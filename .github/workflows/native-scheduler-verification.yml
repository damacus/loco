name: Native scheduler regression verification

on:
  push:
    branches: [codex/verify-native-scheduler]

permissions:
  contents: read

jobs:
  original_scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e5edc69afa0df1501e0ba0c1f02a02eb35cd873b
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-scheduler-verification
      - name: Observe the original scheduler fail the regression
        run: |
          set +e
          cargo test -p loco-rs --lib scheduler::tests::native_task_preserves_arguments_on_start_and_later_ticks -- --exact > "$RUNNER_TEMP/scheduler-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/scheduler-red.log"
          test "$result" -eq 101
          grep -F "native scheduler did not invoke its executable on startup and a later tick" "$RUNNER_TEMP/scheduler-red.log"
          grep -F "0 passed; 1 failed" "$RUNNER_TEMP/scheduler-red.log"
