name: Native scheduler regression verification

on:
  push:
    branches: [codex/verify-native-scheduler]

permissions:
  contents: read

jobs:
  fixed_scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 105964d15d03c7c8dc8991688e97a7ea9dfd8980
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-scheduler-verification
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run scheduler coverage
        run: cargo test -p loco-rs --lib scheduler::tests
      - name: Run upstream workspace tests
        run: cargo test --all-features --workspace --exclude loco-gen --exclude loco
      - name: Run upstream strict Clippy
        run: cargo clippy --workspace --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery -W rust-2018-idioms
      - name: Check documentation links
        run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags -D rustdoc::bare_urls
